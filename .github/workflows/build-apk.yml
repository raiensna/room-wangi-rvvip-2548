name: Build ROOM WANGI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/roomwangi
          unzip -q room-wangi-rvvip-2548-source-fixed.zip -d /tmp/roomwangi
          cp -R /tmp/roomwangi/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          gradle --version || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROOM-WANGI-RVVIP-2548
          path: app/build/outputs/apk/debug/app-debug.apk
